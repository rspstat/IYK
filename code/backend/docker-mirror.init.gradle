// Docker 이미지 빌드(Render)에서만 쓰는 Gradle 초기화 스크립트. Dockerfile 의 --init-script 로 넘긴다(로컬 빌드에는 영향 없음).
//
// Render 빌드 서버의 IP 가 Maven Central(repo.maven.apache.org)에서 429 Too Many Requests 를 계속 받아 빌드가 실패했다.
// 그래서 Maven Central 의 Google Cloud Storage 미러를 먼저 조회하고, 거기에 없는 것(플러그인 마커 등)만 원래 저장소에서 받는다.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

// settings.gradle 의 플러그인(foojay-resolver 등)과 그 의존성을 받는 저장소
beforeSettings { settings ->
    settings.pluginManagement {
        repositories {
            maven { url = mirror }
            gradlePluginPortal()
        }
    }
}

// build.gradle 의 라이브러리를 받는 저장소. build.gradle 의 mavenCentral() 보다 먼저 등록되어 미러가 우선한다.
allprojects {
    repositories {
        maven { url = mirror }
    }
}
