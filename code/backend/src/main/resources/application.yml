spring:
  application:
    name: backend
  config:
    # code/backend/.env 가 있으면 KEY=VALUE 줄을 프로퍼티로 읽는다(없어도 무시). 비밀값을 커밋하지 않기 위한 용도.
    # .env.example 참고. 같은 이름의 OS 환경변수로 대신 지정해도 된다.
    # IYK_ENV_FILE 로 파일 경로를 바꿀 수 있다 — 테스트는 존재하지 않는 파일을 가리켜 실제 키를 읽지 않게 한다(build.gradle).
    import: optional:file:${IYK_ENV_FILE:.env}[.properties]
  datasource:
    url: jdbc:h2:mem:iyk;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  error:
    # Spring DevTools가 개발 모드에서 켜는 include-stacktrace=always 기본값을 명시적으로 덮어쓴다.
    include-stacktrace: never

kakao:
  # 카카오 로그인(OAuth). Kakao Developers 앱의 [플랫폼 키] > REST API 키와 그 클라이언트 시크릿. 비워두면 카카오 로그인 버튼이 숨겨진다.
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}

tourapi:
  # 공공데이터포털(data.go.kr)에서 발급한 한국관광공사 OpenAPI 일반 인증키. Encoding/Decoding 어느 쪽을 넣어도 된다.
  # 공용 키 하나로 9종을 다 쓸 수 있으면 service-key 만, API마다 키가 다르면 keys 아래에 각각 채운다.
  # keys 에 값이 있으면 그 API는 개별 키를, 없으면 공용 키를 쓴다.
  service-key: ${TOURAPI_SERVICE_KEY:}
  keys:
    kor: ${TOURAPI_KEY_KOR:}                    # 국문 관광정보 서비스
    related: ${TOURAPI_KEY_RELATED:}            # 관광지별 연관 관광지 정보
    photo: ${TOURAPI_KEY_PHOTO:}                # 관광사진 정보
    congestion: ${TOURAPI_KEY_CONGESTION:}      # 관광지 집중률 방문자 추이 예측 정보
    pet: ${TOURAPI_KEY_PET:}                    # 반려동물 동반여행 서비스
    barrier-free: ${TOURAPI_KEY_BARRIER_FREE:}  # 무장애 여행 정보
    wellness: ${TOURAPI_KEY_WELLNESS:}          # 웰니스관광정보
    camping: ${TOURAPI_KEY_CAMPING:}            # 고캠핑 정보 조회서비스
    durunubi: ${TOURAPI_KEY_DURUNUBI:}          # 두루누비 정보 서비스

jwt:
  # 개발용 기본값입니다. 배포 전 반드시 환경변수(JWT_SECRET)로 교체하세요.
  secret: ${JWT_SECRET:iyk-dev-only-jwt-secret-key-please-override-in-production-32bytes-min}
  expiration-ms: 86400000 # 24시간
