# Render 무료 웹 서비스는 15분간 요청이 없으면 잠들고, Aiven 무료 MySQL 은 사용이 없으면 전원이 꺼질 수 있다.
# 5분마다 백엔드의 DB 조회 API 를 호출해 둘 다 깨어 있게 한다. (설명: docs/md/DEPLOY.md 9장)
name: keep-alive

on:
  schedule:
    # GitHub 의 예약 실행 최소 간격은 5분이다. 바쁠 때는 몇 분씩 밀릴 수 있다.
    - cron: "*/5 * * * *"
  workflow_dispatch: # Actions 탭에서 수동으로 실행해 볼 수 있다

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend (reads the DB)
        # /api/health 는 DB 를 건드리지 않아서 DB 가 꺼지는 것을 막지 못한다. 추천 API 는 DB 에서 관광지를 읽는다.
        # 잠든 서비스가 깨어나는 데 30~60초가 걸리므로 넉넉히 기다리고, 실패하면 몇 번 다시 시도한다.
        run: |
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            --output /dev/null \
            --write-out "status=%{http_code} time=%{time_total}s\n" \
            "https://iyk-backend.onrender.com/api/recommendations?mbti=ENFP"
